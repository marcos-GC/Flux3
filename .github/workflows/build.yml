name: Compilar y probar (macOS)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # para publicar el instalador en "Releases"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # para numerar la versión

      - name: Versión de Swift y Xcode
        run: |
          xcodebuild -version
          swift --version

      - name: Compilar
        run: swift build

      - name: Tests
        run: swift test

      - name: Crear el instalador (.dmg)
        run: ./make_dmg.sh

      - name: Comprobar que la app del instalador arranca
        run: |
          hdiutil attach dist/FLUX-Studio.dmg -nobrowse -mountpoint "$RUNNER_TEMP/dmg"
          test -L "$RUNNER_TEMP/dmg/Aplicaciones"
          test -f "$RUNNER_TEMP/dmg/FLUX Studio.app/Contents/Resources/AppIcon.icns"
          "$RUNNER_TEMP/dmg/FLUX Studio.app/Contents/MacOS/FluxStudio" &
          PID=$!
          sleep 8
          if kill -0 $PID 2>/dev/null; then
            echo "La app sigue abierta tras 8 s: arranca bien."
            kill $PID
          else
            wait $PID; echo "La app se ha cerrado sola (código $?)"; exit 1
          fi
          hdiutil detach "$RUNNER_TEMP/dmg"

      - name: Crear el instalador con icono (.pkg)
        run: ./make_pkg.sh

      - name: Comprobar el instalador .pkg
        run: |
          pkgutil --expand-full "dist/Instalar FLUX Studio.pkg" "$RUNNER_TEMP/pkg"
          APP="$(find "$RUNNER_TEMP/pkg" -type d -name 'FLUX Studio.app' | head -1)"
          test -n "$APP"
          test -f "$APP/Contents/Resources/AppIcon.icns"
          lipo -archs "$APP/Contents/MacOS/FluxStudio"
          lipo -archs "$APP/Contents/MacOS/FluxStudio" | grep -q x86_64
          lipo -archs "$APP/Contents/MacOS/FluxStudio" | grep -q arm64

      - uses: actions/upload-artifact@v4
        with:
          name: FLUX-Studio-instalador
          path: |
            dist/FLUX-Studio.dmg
            dist/Instalar FLUX Studio.pkg
          retention-days: 30

      - name: Publicar la última versión (Releases → «ultima»)
        if: github.event_name != 'pull_request' && github.ref_name == 'claude/flux-studio-macos-app-afvdnk'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete ultima --cleanup-tag --yes || true
          cp "dist/Instalar FLUX Studio.pkg" dist/Instalar-FLUX-Studio.pkg
          gh release create ultima dist/Instalar-FLUX-Studio.pkg dist/FLUX-Studio.dmg \
            --target "$GITHUB_SHA" \
            --title "FLUX Studio (última versión)" \
            --notes "Instalador generado automáticamente desde el commit ${GITHUB_SHA::7}. Descarga **Instalar-FLUX-Studio.pkg**, ábrelo con doble clic y pulsa Continuar → Instalar. (Alternativa: FLUX-Studio.dmg y arrastrar a Aplicaciones.)"
